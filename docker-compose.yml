services:

  redis:
    image: 'redis:7.4'
    networks:
      - hmpps
    container_name: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5

  gotenberg:
    image: thecodingmachine/gotenberg:7.5.0
    networks:
      - hmpps
    container_name: gotenberg
    ports:
      - "3002:3000"
    restart: always
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3000/health' ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  hmpps:
